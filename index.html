<body><div id="root"></div><script>(function(){var show=function(m){var r=document.getElementById("root");if(r&&!r.children.length)r.innerHTML='<pre style="color:#fff;padding:24px;white-space:pre-wrap;font:14px monospace">MapSpace did not start.\n'+m+'\n\nFix: stop the dev server, delete node_modules/.vite, run npm install, then npm run dev, and hard refresh (Ctrl+Shift+R). Press F12 and open Console for details.</pre>'};addEventListener("error",function(e){show(e.message)});setTimeout(function(){show("No content was rendered after 4 seconds.")},4000)})()</script><script type="module" src="/src/main.jsx"></script></body></html>
